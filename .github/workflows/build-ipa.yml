name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Modèles Upscayl (ncnn)
        run: git clone --depth 1 https://github.com/upscayl/upscayl.git build/upscayl

      - name: Conversion des modèles en Core ML
        env:
          UPSCAYL_MODELS: build/upscayl/resources/models
        run: |
          pip install torch==2.4.0 coremltools==8.0 "numpy<2" pillow
          python scripts/convert_models.py

      - name: Compilation des modèles (.mlmodelc)
        run: |
          mkdir -p build/compiled
          for p in build/models/*.mlpackage; do
            xcrun coremlcompiler compile "$p" build/compiled
          done
          ls build/compiled

      - name: Xcode le plus récent (SDK iOS 26 = vrai Liquid Glass)
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version

      - name: Génération du projet Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (non signé)
        run: |
          xcodebuild \
            -project Upscayl.xcodeproj -scheme Upscayl \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Création de l'.ipa
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/Upscayl.app
          mkdir -p "$APP/Models"
          cp -R build/compiled/*.mlmodelc "$APP/Models/"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Upscayl.ipa Payload)
          ls -lh build/Upscayl.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Upscayl-ipa
          path: build/Upscayl.ipa

      - name: Publier sur la release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_IOS }}
        run: |
          OLD=$(curl -fsSL "https://github.com/${{ github.repository }}/releases/download/latest/version-ios.txt" 2>/dev/null | tr -d '[:space:]' || true)
          gh release create latest -R "${{ github.repository }}" --title "Dernière version" --notes "Builds automatiques (lien fixe)." --target "$GITHUB_SHA" || true
          VERSION=$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/Settings.swift)
          echo "$VERSION" > version-ios.txt
          gh release upload latest build/Upscayl.ipa version-ios.txt -R "${{ github.repository }}" --clobber
          if [ -n "$DISCORD_WEBHOOK" ] && [ "$VERSION" != "$OLD" ]; then
            curl -sS -X POST -H "Content-Type: application/json" \
              -d "{\"content\":\"<@&1562553235720511641> Mise à jour d'Upscayl pour iOS (version $VERSION)\\nTéléchargement : <https://github.com/${{ github.repository }}/releases/download/latest/Upscayl.ipa>\",\"allowed_mentions\":{\"roles\":[\"1562553235720511641\"]}}" \
              "$DISCORD_WEBHOOK"
          fi
